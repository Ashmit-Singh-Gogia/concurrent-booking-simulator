<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Concurrent Booking Simulators</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <Section id="landing-page" class="page">Concurrent Booking Simulators >
        <div class="topbar">
            <span class="project-name">Concurrent Booking Simulators</span>
            <button id="nav-to-sim-from-landing">Simulation Page</button>
        </div>

        <div class="login-box">
            <h2>Login/Signup</h2>
            <input id="login-username" placeholder="User Name" />
            <input id="login-password" type="password" placeholder="Password" />
            <button id="login-submit">Login</button>
        </div>

    </Section>

    <Section id="user-ui-page" class="page hidden">
        <div class="topbar">
            <span class="project-name">Concurrent Booking Simulators</span>
            <button id="reset-from-user-ui">Reset Simulations</button>
            <button id="nav-to-sim-from-user-ui">Simulation Page</button>
            <button id="logout">Log Out</button>
        </div>

        <div id="seat-grid"></div>
        <button id="confirm-selection" disabled>Confirm Selection Seat</button>
    </Section>

    <Section id="simulation-page" class="page hidden">
        <div class="topbar">
            <span class="project-name">Concurrent Booking Simulators</span>
            <button id="nav-to-landing-from-sim">Landing Page</button>
            <button id="nav-to-user-ui-from-sim">User Interface</button>
        </div>

        <div class="sim-layout">
            <div class="log-panel">
                <h3>Logs</h3>
                <ul id="log"></ul>
            </div>
            <div class="sim-controls">
                <button id="reset-from-sim">Reset Simulations</button>
            </div>
        </div>

    </Section>

    <div id="booking-popup" class="popup hidden">
        <div class="popup-box">
            <h3>Confirm Booking</h3>
            <p id="popup-seat-list"></p>
            <button id="confirm-booking-btn" class="btn-confirm">Confirm Booking</button>
            <button id="reject-booking-btn" class="btn-reject">Reject Booking</button>
        </div>
    </div>

    <script type="module" src="./js/main.js"></script>
</body>

</html>
